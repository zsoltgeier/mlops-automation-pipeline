name: garments-mlops

x-image: &application-image
  image: garments-mlops:local
  pull_policy: build
  build:
    context: .

services:
  mlflow:
    <<: *application-image
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --workers
      - "1"
      - --backend-store-uri
      - sqlite:////app/runtime/mlflow.db
      - --serve-artifacts
      - --artifacts-destination
      - /app/runtime/artifacts
      - --allowed-hosts
      - "mlflow:5000,localhost:*,127.0.0.1:*"
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow-state:/app/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  api:
    <<: *application-image
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLOPS_BOOTSTRAP: "true"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - api-state:/app/runtime
      - prepared-data:/app/data/processed
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 120s
    restart: unless-stopped

volumes:
  mlflow-state:
  api-state:
  prepared-data:
