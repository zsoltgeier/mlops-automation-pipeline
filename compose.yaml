name: garments-mlops

x-image: &application-image
  image: garments-mlops:local
  pull_policy: build
  build:
    context: .

services:
  mlflow:
    <<: *application-image
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --workers
      - "1"
      - --backend-store-uri
      - sqlite:////app/runtime/mlflow.db
      - --serve-artifacts
      - --artifacts-destination
      - /app/runtime/artifacts
      - --allowed-hosts
      - "mlflow:5000,localhost:*,127.0.0.1:*"
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow-state:/app/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  api:
    <<: *application-image
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLOPS_BOOTSTRAP: "true"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - api-state:/app/runtime
      - prepared-data:/app/data/processed
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 120s
    restart: unless-stopped

  dashboard:
    <<: *application-image
    command:
      - sh
      - -c
      - >-
        garments-monitor --demo-if-empty &&
        exec streamlit run src/garments_mlops/dashboard.py
        --server.address=0.0.0.0 --server.port=8501 --server.headless=true --browser.gatherUsageStats=false
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLOPS_API_URL: http://api:8000
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8501}:8501"
    volumes:
      - prepared-data:/app/data/processed:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 120s
    restart: unless-stopped

  airflow:
    image: garments-airflow:local
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile.airflow
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__PARALLELISM: "1"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__API__WORKERS: "1"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/state/airflow.db
      MLOPS_API_URL: http://api:8000
      MLOPS_REFERENCE: /data/reference.csv
      MLOPS_AIRFLOW_SCHEDULE: ${MLOPS_AIRFLOW_SCHEDULE:-}
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    volumes:
      - airflow-state:/opt/airflow/state
      - prepared-data:/data:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json; from urllib.request import urlopen;
          h=json.load(urlopen('http://127.0.0.1:8080/api/v2/monitor/health', timeout=3));
          assert all(h[k]['status']=='healthy' for k in ('metadatabase','scheduler','dag_processor'));
          urlopen('http://127.0.0.1:8080/api/v2/dags/garment_productivity', timeout=3).close()
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 180s
    restart: unless-stopped

volumes:
  mlflow-state:
  api-state:
  prepared-data:
  airflow-state:
