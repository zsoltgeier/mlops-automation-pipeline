[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "garments-mlops"
version = "0.1.0"
description = "Reproducible garment productivity MLOps workflows"
requires-python = ">=3.11,<3.12"
dynamic = ["dependencies"]

[project.scripts]
garments-prepare = "garments_mlops.prepare:main"
garments-train = "garments_mlops.train_cli:main"
garments-smoke = "garments_mlops.smoke:main"
garments-monitor = "garments_mlops.monitor_cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.in"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
filterwarnings = [
    "error",
    # MLflow imports an unrelated ResponsesAgent Any schema while saving sklearn models.
    "ignore:.*Any type hint is inferred as AnyType.*:UserWarning:mlflow.types.type_hints",
    # Evidently 0.7.23's legacy assertion helpers still access numpy.core on NumPy 2.x.
    "ignore:numpy.core is deprecated.*:DeprecationWarning:evidently.legacy.tests.utils",
]

[tool.coverage.run]
source = ["src", "tests"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
venvPath = ".conda/envs"
venv = "mlops"
