name: Quality and Docker integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DO_NOT_TRACK: "1"
  MLFLOW_DISABLE_TELEMETRY: "true"
  MLFLOW_DISABLE_AGENT_HINT: "1"
  MLFLOW_ENABLE_ARTIFACTS_PROGRESS_BAR: "false"
  PRE_COMMIT_HOME: ${{ github.workspace }}/.cache/pre-commit

jobs:
  quality:
    name: Tests, coverage, lint and types
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Restore the pinned public dataset
        run: python src/garments_mlops/fetch_data.py
      - name: Install the exact Python environment
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Validate and run the same quality hook used locally
        run: |
          python -m pre_commit validate-config
          python -m pre_commit run project-quality --all-files --show-diff-on-failure
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-reports
          path: |
            coverage.xml
            runtime/test-results.xml
          retention-days: 14
          if-no-files-found: warn

  docker:
    name: Build image and test the complete Compose system
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.14"
      - name: Restore the pinned public dataset
        run: python src/garments_mlops/fetch_data.py
      - name: Validate Compose, build and exercise isolated services
        run: |
          docker compose config --quiet
          make system-smoke
      - name: Upload build, service and smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-integration-reports
          path: runtime/system-smoke/
          retention-days: 14
          if-no-files-found: warn
