minimum_pre_commit_version: 4.7.0
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: project-quality
        name: Tests, coverage, Flake8 and both Pyright modes
        entry: make quality
        language: system
        stages: [pre-commit, manual]
        pass_filenames: false
        always_run: true
        require_serial: true
      - id: docker-build
        name: Docker Compose configuration and image build
        entry: make docker-build
        language: system
        stages: [pre-push, manual]
        pass_filenames: false
        always_run: true
        require_serial: true
